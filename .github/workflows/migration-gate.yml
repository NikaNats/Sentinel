#
# Database Migration & Rollback Testing Gate
#
# Runs the comprehensive migration test suite to verify:
# - Forward/rollback migration verification
# - Data integrity across migration cycles
# - Concurrent migration under active traffic
# - Partial migration recovery (interrupted migrations)
# - Cross-version compatibility (old code/new schema, new code/old schema)
# - Chaos engineering for migration edge cases
#
# Gate philosophy: Zero-downtime deployments require mathematically proven
# migration safety. This gate runs against a real PostgreSQL 17 instance
# via Testcontainers.
name: Migration Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/Sentinel.EntityFrameworkCore/**'
      - 'src/Sentinel.Infrastructure/Persistence/**'
      - 'tests/Sentinel.Tests.Integration/Database/**'
      - 'tests/Sentinel.Contracts/Postgres/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-gate:
    name: Migration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore Dependencies
        run: dotnet restore Sentinel.slnx --locked-mode

      # NOTE: dotnet test --filter executes ZERO tests for xunit.v3 under the
      # default Microsoft.Testing.Platform runner (exit 5), so build once and
      # run the VSTest console path where --TestCaseFilter is honored.
      - name: Build Migration Test Assemblies
        run: |
          dotnet build tests/Sentinel.Contracts/Sentinel.Contracts.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true
          dotnet build tests/Sentinel.Tests.Integration/Sentinel.Tests.Integration.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

      - name: Run Migration Contract Tests
        run: |
          dotnet vstest tests/Sentinel.Contracts/bin/Release/net10.0/Sentinel.Contracts.dll \
            --TestCaseFilter:"FullyQualifiedName~Sentinel.Contracts.Postgres.MigrationCompatibilityContractTests" \
            --logger:"console;verbosity=detailed"

      - name: Run Comprehensive Migration Tests
        run: |
          dotnet vstest tests/Sentinel.Tests.Integration/bin/Release/net10.0/Sentinel.Tests.Integration.dll \
            --TestCaseFilter:"FullyQualifiedName~Sentinel.Tests.Integration.Database.ComprehensiveMigrationTests" \
            --logger:"console;verbosity=detailed"

      - name: Run Migration Chaos Tests
        run: |
          dotnet vstest tests/Sentinel.Tests.Integration/bin/Release/net10.0/Sentinel.Tests.Integration.dll \
            --TestCaseFilter:"FullyQualifiedName~Sentinel.Tests.Integration.Database.MigrationChaosTests" \
            --logger:"console;verbosity=detailed"

      - name: Run Cross-Version Compatibility Tests
        run: |
          dotnet vstest tests/Sentinel.Tests.Integration/bin/Release/net10.0/Sentinel.Tests.Integration.dll \
            --TestCaseFilter:"FullyQualifiedName~Sentinel.Tests.Integration.Database.CrossVersionCompatibilityTests" \
            --logger:"console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 7
