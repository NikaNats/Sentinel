name: Sentinel Core CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SkipGetBuildVersion: true
  CloudBuild: false
  GitVersioningCloudBuild: false

permissions:
  contents: read
  security-events: write

jobs:
  build-scan:
    name: Build & Core Security
    runs-on: ubuntu-latest
    env:
      SENTINEL_SNK_BASE64: ${{ secrets.SENTINEL_SNK_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure Full Git History For Versioning
        run: |
          git fetch origin main --unshallow || true
          git fetch --prune --unshallow --tags || true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore strong-name key (Staging/Release Only)
        if: ${{ env.SENTINEL_SNK_BASE64 != '' }}
        shell: bash
        run: echo "$SENTINEL_SNK_BASE64" | base64 -d > Sentinel.snk

      - name: Gate 1 - Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          extra_args: --only-verified

      - name: Gate 2 - SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/csharp

      - name: Gate 3 - NuGet Dependency Audit (Blocking)
        shell: bash
        run: |
          dotnet restore Sentinel.slnx --locked-mode
          AUDIT_OUTPUT=$(dotnet list Sentinel.slnx package --vulnerable --include-transitive)
          echo "$AUDIT_OUTPUT"
          if echo "$AUDIT_OUTPUT" | grep -iqE "has the following vulnerable packages|critical|high"; then
            echo "::error::Blocking build: Vulnerable packages detected in dependency tree!"
            exit 1
          fi

      - name: Setup NodeJS (for OpenAPI Audit)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gate 4 - Build & Generate OpenAPI Contract
        run: dotnet build tests/Sentinel.Tests.Load/AdversarialTestHost.csproj --configuration Release

      - name: Fetch OpenAPI Schema from Running Host
        run: |
          dotnet run --project tests/Sentinel.Tests.Load/AdversarialTestHost.csproj -c Release --no-build --urls http://localhost:5000 > host.log 2>&1 &
          HOST_PID=$!
          
          echo "Waiting for AdversarialTestHost (PID: $HOST_PID) to start..."
          READY=false
          for i in {1..30}; do
            if curl -s http://localhost:5000/healthz > /dev/null 2>&1; then
              echo "✓ Host is ready!"
              READY=true
              break
            fi
            sleep 1
          done
          
          if [ "$READY" = "false" ]; then
            echo "CRITICAL: Host failed to start. Printing crash logs:"
            cat host.log
            exit 1
          fi
          
          echo "Fetching compiled OpenAPI schema..."
          mkdir -p docs
          curl -s http://localhost:5000/openapi/v1.json -o docs/generated_openapi.json
          
          echo "Gracefully terminating AdversarialTestHost (PID: $HOST_PID)..."
          kill $HOST_PID
          wait $HOST_PID 2>/dev/null || true

      - name: Gate 5 - OpenAPI Schema Drift Audit
        run: |
          chmod +x tests/infrastructure-openapi-audit.sh
          ./tests/infrastructure-openapi-audit.sh

      - name: Gate 6 - Generate SBOM
        uses: anchore/sbom-action@v0.17.9
        with:
          format: 'spdx-json'
          output-file: 'docs/sentinel-sbom.spdx.json'

      - name: Gate 7 - Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-sbom
          path: docs/sentinel-sbom.spdx.json

      - name: Gate 8 - IaC Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@v12.2882.0
        with:
          framework: kubernetes,dockerfile
          output_format: cli
          soft_fail: false
          skip_check: CKV_DOCKER_4,CKV_K8S_43
          quiet: false

      - name: Gate 9 - Deterministic NuGet Compilation & Package Verification
        run: |
          mkdir -p ./artifacts/packages
          dotnet build Sentinel.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet pack Sentinel.slnx -c Release --no-build --output ./artifacts/packages
          ls -lh ./artifacts/packages/*.nupkg

      - name: Gate 10 - Cryptographic Lifecycle & Rotation Tests
        run: |
          dotnet test tests/Sentinel.Tests.Integration/Sentinel.Tests.Integration.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~JwksRotation|FullyQualifiedName~KestrelCertificateHotReload|FullyQualifiedName~MtlsCertificateRotation|FullyQualifiedName~EnvelopeRewrap" \
            --logger "console;verbosity=detailed" \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true
          dotnet test tests/Sentinel.Tests.Unit/Sentinel.Tests.Unit.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~MtlsCertificateRotation|FullyQualifiedName~EnvelopeRewrap" \
            --logger "console;verbosity=detailed" \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

  contract-gate:
    name: Contract Compliance Gate
    runs-on: ubuntu-latest
    needs: build-scan
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore
        run: dotnet restore tests/Sentinel.Contracts/Sentinel.Contracts.csproj --locked-mode

      - name: Generate Local CA/Keycloak Certificates (Keycloak fixture)
        run: bash infra/certs/generate-certs.sh

      - name: Pre-pull Testcontainers Images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7.4-alpine
          docker pull quay.io/keycloak/keycloak:26.6.4

      - name: Run All Contract Tests
        run: >
          dotnet test tests/Sentinel.Contracts/Sentinel.Contracts.csproj
          --configuration Release --no-restore
          --logger "console;verbosity=detailed"
          -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

  test-suites:
    name: Test (${{ matrix.test-project }})
    runs-on: ubuntu-latest
    needs: [build-scan, contract-gate]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SENTINEL_SNK_BASE64: ${{ secrets.SENTINEL_SNK_BASE64 }}
      TESTCONTAINERS_RYUK_DISABLED: true
    strategy:
      fail-fast: false
      matrix:
        test-project:
          - tests/Sentinel.Tests.Unit/Sentinel.Tests.Unit.csproj
          - tests/Sentinel.Tests.Integration/Sentinel.Tests.Integration.csproj
          - tests/Sentinel.Tests.Security/Sentinel.Tests.Security.csproj
          - tests/Sentinel.Tests.DPoP/Sentinel.Tests.DPoP.csproj
          - tests/Sentinel.Tests.Session/Sentinel.Tests.Session.csproj
          - tests/Sentinel.Tests.SSF/Sentinel.Tests.SSF.csproj
          - tests/Sentinel.Tests.Concurrency/Sentinel.Tests.Concurrency.csproj

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore strong-name key (Staging/Release Only)
        if: ${{ env.SENTINEL_SNK_BASE64 != '' }}
        shell: bash
        run: echo "$SENTINEL_SNK_BASE64" | base64 -d > Sentinel.snk

      - name: Restore
        run: dotnet restore ${{ matrix.test-project }} --locked-mode

      - name: Generate Local CA/Keycloak Certificates (Testcontainers fixtures)
        run: bash infra/certs/generate-certs.sh

      - name: Pre-pull Testcontainers Images
        run: |
          docker pull postgres:17-alpine
          docker pull postgres:16-alpine
          docker pull redis:7.4-alpine
          docker pull quay.io/keycloak/keycloak:26.6.4
          docker pull quay.io/keycloak/keycloak:26.1
          docker pull hashicorp/vault:1.15
          docker pull ghcr.io/shopify/toxiproxy:2.11.0

      - name: Build Integration (generates Playwright CLI)
        if: matrix.test-project == 'tests/Sentinel.Tests.Integration/Sentinel.Tests.Integration.csproj'
        run: dotnet build ${{ matrix.test-project }} --configuration Release --no-restore --nologo -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

      - name: Install Playwright Chromium (browser-mediated FAPI 2.0 E2E)
        if: matrix.test-project == 'tests/Sentinel.Tests.Integration/Sentinel.Tests.Integration.csproj'
        run: |
          CLI="tests/Sentinel.Tests.Integration/bin/Release/net10.0/playwright.ps1"
          pwsh "$CLI" install chromium
          sudo pwsh "$CLI" install-deps chromium

      - name: Test
        if: matrix.test-project != 'tests/Sentinel.Tests.Concurrency/Sentinel.Tests.Concurrency.csproj'
        run: |
          dotnet test ${{ matrix.test-project }} --configuration Release --no-restore \
            --logger "console;verbosity=detailed" \
            /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura \
            /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

      - name: Coyote Systematic Concurrency Proof (1000 iterations, IL-rewritten)
        if: matrix.test-project == 'tests/Sentinel.Tests.Concurrency/Sentinel.Tests.Concurrency.csproj'
        run: |
          dotnet tool restore
          dotnet build tests/Sentinel.Tests.Concurrency/Sentinel.Tests.Concurrency.csproj \
            --configuration Release -p:RunCoyoteRewrite=true --no-restore --nologo
          dotnet test tests/Sentinel.Tests.Concurrency/Sentinel.Tests.Concurrency.csproj \
            --configuration Release --no-build --no-restore \
            --logger "console;verbosity=detailed" \
            -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

  schemathesis-fuzzing:
    name: Dynamic OpenAPI Schema Fuzzing
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Schemathesis CLI
        run: pip install "schemathesis==4.23.0"

      - name: Build Test Host
        run: dotnet build tests/Sentinel.Tests.Load/AdversarialTestHost.csproj --configuration Release

      - name: Start Test Host in Background
        run: |
          dotnet run --project tests/Sentinel.Tests.Load/AdversarialTestHost.csproj -c Release -p:SkipGetBuildVersion=true -p:NBGV_Disable=true --no-build --urls http://localhost:5000 > host.log 2>&1 &
          HOST_PID=$!
          echo "HOST_PID=$HOST_PID" >> "$GITHUB_ENV"
          
          echo "Waiting for AdversarialTestHost (PID: $HOST_PID) to bind to http://localhost:5000..."
          READY=false
          for i in {1..30}; do
            if curl -s http://localhost:5000/healthz > /dev/null 2>&1; then
              echo "✓ Host is ready!"
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" = "false" ]; then
            echo "CRITICAL: AdversarialTestHost failed to start. Host logs:"
            cat host.log
            exit 1
          fi

      - name: Run Schemathesis API Schema Fuzzing
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p artifacts
          schemathesis run docs/OPENAPI_3_1.yaml \
            --url http://localhost:5000 \
            --phases coverage \
            --checks not_a_server_error \
            --workers 2 \
            --report junit \
            --report-junit-path artifacts/fuzz-results.xml

      - name: Stop Test Host
        if: always()
        run: |
          if [ -n "$HOST_PID" ]; then
            kill "$HOST_PID" 2>/dev/null || true
          fi

      - name: Upload Schemathesis Fuzzing Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-fuzz-results
          path: artifacts/fuzz-results.xml
          if-no-files-found: error

  native-aot-gate:
    name: Native AOT Serialization Gate
    runs-on: ubuntu-latest
    needs: build-scan
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Install Native AOT prerequisites (clang, zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore tests/Sentinel.Tests.Load/AdversarialTestHost.csproj --locked-mode

      - name: Publish Native AOT and sweep endpoint matrix
        run: |
          chmod +x tests/scripts/validate-native-aot.sh
          ./tests/scripts/validate-native-aot.sh linux-x64

      - name: Upload host log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-host-log
          path: artifacts/aot/host.log
          if-no-files-found: ignore

  acceptance-e2e:
    name: Acceptance / E2E (FAPI + CAEP Evidence)
    runs-on: ubuntu-latest
    needs: [build-scan, contract-gate]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SENTINEL_SNK_BASE64: ${{ secrets.SENTINEL_SNK_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore strong-name key (Staging/Release Only)
        if: ${{ env.SENTINEL_SNK_BASE64 != '' }}
        shell: bash
        run: echo "$SENTINEL_SNK_BASE64" | base64 -d > Sentinel.snk

      - name: Restore
        run: dotnet restore tests/Sentinel.Tests.Acceptance/Sentinel.Tests.Acceptance.csproj --locked-mode

      - name: Run Reqnroll Acceptance Suite (self-managed Redis/Keycloak via Docker)
        run: dotnet test tests/Sentinel.Tests.Acceptance/Sentinel.Tests.Acceptance.csproj --configuration Release --no-restore --logger "console;verbosity=detailed" -p:SkipGetBuildVersion=true -p:NBGV_Disable=true

  observability-gate:
    name: Observability E2E Gate (Layer 2)
    runs-on: ubuntu-latest
    needs: [build-scan, contract-gate]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KEYCLOAK_GATE_PASSWORD: gate-pass

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup NodeJS (mint + proof signing)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Local CA/Keycloak Certificates (Docker build context)
        run: bash infra/certs/generate-certs.sh

      - name: Run Observability E2E Gate
        run: |
          chmod +x tests/scripts/validate-observability.sh
          ./tests/scripts/validate-observability.sh

  fapi-local-preflight:
    name: FAPI 2.0 Conformance (local pre-flight)
    runs-on: ubuntu-latest
    needs: build-scan
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-fapi')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate suite TLS certs (keystore + CA truststore)
        run: bash infra/fapi-conformance/certs/generate-fapi-certs.sh

      - name: Generate Keycloak dev certs and start AS stack
        run: |
          bash infra/certs/generate-certs.sh
          docker compose up -d keycloak redis
          for i in $(seq 1 60); do
            if curl -ksf https://localhost:8443/realms/sentinel-dast/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "✓ Keycloak is up"
              break
            fi
            [ "$i" -eq 60 ] && { echo "Keycloak failed to start"; docker compose logs keycloak; exit 1; }
            sleep 3
          done

      - name: Create .env for local suite
        run: |
          cp infra/fapi-conformance/.env.example infra/fapi-conformance/.env
          TOKEN=$(openssl rand -hex 32)
          sed -i "s/REPLACE_ME_WITH_RANDOM_HEX/${TOKEN}/" infra/fapi-conformance/.env
          echo "FAPI_SUITE_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Start OIDF Conformance Suite
        run: |
          docker compose -f infra/fapi-conformance/docker-compose.yml \
            --env-file infra/fapi-conformance/.env up -d --build
          for i in $(seq 1 90); do
            if curl -ksf https://localhost:8443/api/info > /dev/null 2>&1; then
              echo "✓ OIDF suite is up"
              break
            fi
            [ "$i" -eq 90 ] && { echo "Suite failed to start"; docker compose -f infra/fapi-conformance/docker-compose.yml logs conformance-server; exit 1; }
            sleep 2
          done

      - name: Run FAPI 2.0 Conformance (local pre-flight)
        env:
          FAPI_MODE: local
          FAPI_SUITE_URL: https://localhost:8443
          FAPI_SUITE_TOKEN: ${{ env.FAPI_SUITE_TOKEN }}
          ISSUER_URL: https://keycloak:8443/realms/sentinel-dast
          FAPI_CLIENT_ID: sentinel-fapi-conformance
          FAPI_CLIENT2_ID: sentinel-fapi-conformance-mixup
          FAPI_PROVISION_HOOK: infra/keycloak/scripts/provision-fapi-conformance-clients.sh
          DOCKER_FALLBACK: "true"
          KC_ADMIN_URL: https://localhost:8443
          KC_ADMIN_USER: admin
          KC_ADMIN_PASSWORD: admin
          KC_REALM: sentinel-dast
          KC_TRUSTSTORE_HOST: ${{ github.workspace }}/infra/fapi-conformance/certs/truststore.p12
          KC_TRUSTSTORE_PASS: sentinel-fapi
          FAPI_MAX_POLL: 2400
          FAPI_POLL_INTERVAL: 15
        run: bash infra/dast/scripts/run-fapi-conformance.sh

      - name: Upload FAPI conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fapi-local-preflight-evidence-${{ github.sha }}
          path: artifacts/fapi/
          retention-days: 365

      - name: Tear down suite + AS stack
        if: always()
        run: |
          docker compose -f infra/fapi-conformance/docker-compose.yml down -v --remove-orphans || true
          docker compose down -v --remove-orphans || true

  publish-nuget:
    name: Package, Attest & Publish NuGet
    runs-on: ubuntu-latest
    needs: [build-scan, test-suites]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SENTINEL_SNK_BASE64: ${{ secrets.SENTINEL_SNK_BASE64 }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Strong-Name Key
        if: ${{ env.SENTINEL_SNK_BASE64 != '' }}
        shell: bash
        run: echo "$SENTINEL_SNK_BASE64" | base64 -d > Sentinel.snk

      - name: Restore Locked Dependencies
        run: dotnet restore Sentinel.slnx --locked-mode

      - name: Build with Strong-Name Signing
        run: |
          dotnet build Sentinel.slnx -c Release --no-restore \
            -p:SignSentinelRelease=true \
            -p:ContinuousIntegrationBuild=true

      - name: Create Packed NuGet Artifacts
        run: |
          mkdir -p ./artifacts/nuget
          dotnet pack Sentinel.slnx -c Release --no-build \
            -p:SignSentinelRelease=true \
            -p:ContinuousIntegrationBuild=true \
            --output ./artifacts/nuget

      - name: Generate CycloneDX / SPDX SBOM for Packages
        uses: anchore/sbom-action@v0.17.9
        with:
          path: ./src
          format: 'spdx-json'
          output-file: './artifacts/nuget/sentinel-libraries.spdx.json'

      - name: Generate Build Provenance Attestation (SLSA Level 3)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './artifacts/nuget/*.nupkg'

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Publish to NuGet.org (Official Release Tags Only)
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ env.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Archive Released Packages
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-nuget-packages-${{ github.sha }}
          path: ./artifacts/nuget/
          retention-days: 90