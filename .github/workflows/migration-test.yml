#
# Database Migration & Rollback Testing Gate
#
# Runs the comprehensive migration test suite to verify:
# - Forward/rollback migration verification
# - Data integrity across migration cycles
# - Concurrent migration under active traffic
# - Partial migration recovery (interrupted migrations)
# - Cross-version compatibility (old code/new schema, new code/old schema)
# - Chaos engineering for migration edge cases
#
# Gate philosophy: Zero-downtime deployments require mathematically proven
# migration safety. This gate runs against a real PostgreSQL 17 instance
# via Testcontainers.
name: Migration Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/Sentinel.EntityFrameworkCore/**'
      - 'src/Sentinel.Infrastructure/Persistence/**'
      - 'tests/Sentinel.Tests.Integration/Database/**'
      - 'tests/Sentinel.Contracts/Postgres/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-gate:
    name: Migration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Install dotnet-ef tool
        run: |
          dotnet tool restore
          dotnet ef --version

      - name: Start PostgreSQL (Testcontainers will manage container)
        run: |
          # Testcontainers will start PostgreSQL automatically
          echo "PostgreSQL will be started by Testcontainers in tests"

      - name: Run Migration Contract Tests
        run: |
          dotnet test tests/Sentinel.Contracts/Postgres/MigrationCompatibilityContractTests.cs \
            --logger "console;verbosity=detailed" \
            --filter "FullyQualifiedName~Sentinel.Contracts.Postgres.MigrationCompatibilityContractTests"

      - name: Run Comprehensive Migration Tests
        run: |
          dotnet test tests/Sentinel.Tests.Integration/Database/ComprehensiveMigrationTests.cs \
            --logger "console;verbosity=detailed" \
            --filter "FullyQualifiedName~Sentinel.Tests.Integration.Database.ComprehensiveMigrationTests"

      - name: Run Migration Chaos Tests
        run: |
          dotnet test tests/Sentinel.Tests.Integration/Database/MigrationChaosTests.cs \
            --logger "console;verbosity=detailed" \
            --filter "FullyQualifiedName~Sentinel.Tests.Integration.Database.MigrationChaosTests"

      - name: Run Cross-Version Compatibility Tests
        run: |
          dotnet test tests/Sentinel.Tests.Integration/Database/CrossVersionCompatibilityTests.cs \
            --logger "console;verbosity=detailed" \
            --filter "FullyQualifiedName~Sentinel.Tests.Integration.Database.CrossVersionCompatibilityTests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 7