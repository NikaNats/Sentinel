#
# Sentinel OIDF FAPI 2.0 Conformance Gate.
#
# Runs the official OpenID Foundation FAPI 2.0 Conformance Suite (Security
# Profile + DPoP variant, plain_fapi, private_key_jwt) against the PUBLICLY
# REACHABLE staging Keycloak, archives the certificate + HTML report with a
# SHA-256 chain-of-custody manifest, commits the certificate into
# docs/compliance/ (release evidence), and gates release/** on PASSED.
#
# Pipeline (DOC-0017 Phase 7):
#   1. Verify FAPI Readiness - fails fast on a misconfigured staging AS
#      (infra/staging/verify-fapi-readiness.sh) before a certification
#      attempt is burned on the hosted suite.
#   2. Run FAPI 2.0 Conformance Suite - authoritative OIDF result; any
#      non-PASSED outcome fails the workflow, which blocks the release.
#   3. Commit Evidence on PASSED - archive fapi2-certificate-<date>.pdf +
#      the SHA-256 manifest into docs/compliance/ (skipped if today's
#      certificate is already committed, so a repeat run cannot loop).
#   4. FAPI 2.0 Evidence Gate - defense-in-depth: verifies the committed
#      evidence exists on the release branch before the run is green.
#
# Prerequisites (see docs/OIDF_FAPI_CONFORMANCE_RUNBOOK.md):
#   * environment 'staging-fapi' with the secrets below
#   * staging Keycloak publicly routable with a CA-signed certificate
#   * conformance clients trusted by Keycloak (auto-provisioned via
#     FAPI_PROVISION_HOOK when the provision script can reach the admin API)
name: FAPI 2.0 Conformance Gate

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fapi-conformance:
    name: OIDF FAPI 2.0 Conformance
    runs-on: ubuntu-latest
    environment: staging-fapi
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify FAPI Readiness (Pre-flight)
        shell: bash
        env:
          KEYCLOAK_URL: ${{ secrets.STAGING_KEYCLOAK_ISSUER }}
          KC_ADMIN_URL: ${{ secrets.STAGING_KEYCLOAK_ADMIN_URL }}
          KC_ADMIN_USER: ${{ secrets.STAGING_KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASSWORD: ${{ secrets.STAGING_KEYCLOAK_ADMIN_PASSWORD }}
          REALM: ${{ secrets.STAGING_KEYCLOAK_REALM }}
        run: |
          bash infra/staging/verify-fapi-readiness.sh

      - name: Run FAPI 2.0 Conformance Suite
        shell: bash
        env:
          FAPI_SUITE_URL: ${{ secrets.FAPI_SUITE_URL }}
          FAPI_SUITE_TOKEN: ${{ secrets.FAPI_SUITE_TOKEN }}
          ISSUER_URL: ${{ secrets.STAGING_KEYCLOAK_ISSUER }}
          RESOURCE_URL: ${{ secrets.STAGING_API_RESOURCE_URL }}
          FAPI_CLIENT_ID: "sentinel-fapi-conformance"
          FAPI_CLIENT2_ID: "sentinel-fapi-conformance-mixup"
          FAPI_PROVISION_HOOK: "infra/keycloak/scripts/provision-fapi-conformance-clients.sh"
          KC_ADMIN_URL: ${{ secrets.STAGING_KEYCLOAK_ADMIN_URL }}
          KC_ADMIN_USER: ${{ secrets.STAGING_KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASSWORD: ${{ secrets.STAGING_KEYCLOAK_ADMIN_PASSWORD }}
          KC_REALM: ${{ secrets.STAGING_KEYCLOAK_REALM }}
        run: |
          bash infra/dast/scripts/run-fapi-conformance.sh

      - name: Commit Evidence on PASSED
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          CERT_FILE="docs/compliance/fapi2-certificate-$(date -u +%F).pdf"
          if [[ -f "$CERT_FILE" ]]; then
            echo "Evidence for $(date -u +%F) already committed; skipping commit."
            exit 0
          fi
          if [[ ! -f artifacts/fapi/fapi-certificate.pdf ]]; then
            echo "::error::PASSED without certificate artifact - refusing to commit evidence"
            exit 1
          fi
          mkdir -p docs/compliance
          cp artifacts/fapi/fapi-certificate.pdf "$CERT_FILE"
          cp artifacts/fapi/fapi-evidence-manifest.txt docs/compliance/
          git config user.name "sentinel-ci"
          git config user.email "sre@sentinel.io"
          git add docs/compliance/
          git commit -m "docs(compliance): archive OIDF FAPI 2.0 conformance certificate $(date -u +%F) (${{ github.sha }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Archive Conformance Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fapi2-conformance-evidence-${{ github.sha }}
          path: artifacts/fapi/
          retention-days: 365

  fapi-evidence-gate:
    name: FAPI 2.0 Evidence Gate (release proof)
    runs-on: ubuntu-latest
    needs: fapi-conformance
    if: needs.fapi-conformance.result == 'success' && startsWith(github.ref_name, 'release/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify committed evidence on release branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          CERT=$(git ls-tree -r --name-only "origin/$BRANCH" docs/compliance/ \
            | grep -E 'fapi2-certificate-[0-9]{4}-[0-9]{2}-[0-9]{2}\.pdf' \
            | sort | tail -n 1)
          if [[ -z "$CERT" ]]; then
            echo "::error::No OIDF FAPI 2.0 conformance certificate committed in docs/compliance/ on release branch '$BRANCH' - release blocked."
            exit 1
          fi
          git show "origin/$BRANCH:$CERT" >/dev/null || {
            echo "::error::Certificate '$CERT' is not readable on the branch - release blocked."
            exit 1
          }
          echo "Evidence verified: $CERT (committed $(git log -1 --format=%cs "origin/$BRANCH" -- "$CERT"))"
