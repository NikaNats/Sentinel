apiVersion: v1
kind: Pod
metadata:
  name: dpop-runner
  namespace: sentinel-test
  labels:
    app.kubernetes.io/name: dpop-e2e-runner
    app.kubernetes.io/component: test-runner
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node
      image: node:24-alpine
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dpop-runner-egress-allow
  namespace: sentinel-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dpop-e2e-runner
  policyTypes:
    - Egress
  egress:
    # 1. DNS Resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Keycloak Token Issuance
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8443
    # 3. Sentinel API Gateway Testing (HTTPS :8080)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: identity-gateway
      ports:
        - protocol: TCP
          port: 8080
---
# Allow test-runner to access the Sentinel API in the test namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-api-allow-test-runner
  namespace: sentinel-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: identity-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dpop-e2e-runner
      ports:
        - protocol: TCP
          port: 8080
