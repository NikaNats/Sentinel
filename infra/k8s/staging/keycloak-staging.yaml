#
# Staging Keycloak for the FAPI 2.0 OIDF Conformance Gate (DOC-0017 Phase 1).
# Deployed in the "staging" namespace. The cloud-hosted OIDF Conformance Suite
# must reach this AS over public DNS with CA-signed TLS - self-signed certs
# are rejected by the suite (see docs/OIDF_FAPI_CONFORMANCE_RUNBOOK.md §1).
#
# Prerequisites (see infra/staging/provision-staging-tls.sh and
# docs/OIDF_FAPI_CONFORMANCE_RUNBOOK.md §1.1):
#   1. Secret "keycloak-staging-tls"   - tls.crt / tls.key (Let's Encrypt or ACM)
#   2. Secret "keycloak-staging-admin" - KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
#   3. Secret "keycloak-staging-db"    - username (must be "keycloak") / password
#   4. ConfigMap "sentinel-realm-config" with sentinel-dast.json:
#        kubectl create configmap sentinel-realm-config -n staging \
#          --from-file=infra/keycloak/realms/sentinel-dast.json
#
# Keycloak runs in production mode ("start"), which requires an external
# database - the bundled H2 database is dev-only and the pod would
# CrashLoopBackOff otherwise. PostgreSQL (postgres-staging) ships in this file;
# the keycloak-staging-db secret provides the credentials to both.
apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: staging
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: staging
  annotations:
    checkov.io/skip1: CKV_K8S_35=admin credentials are injected from the keycloak-staging-admin Secret via secretKeyRef (never plaintext); Keycloak's configuration contract is environment-variable based
    checkov.io/skip2: "CKV_K8S_40=UID 1000 is the image's declared user (quay.io/keycloak sets USER 1000); raising it would break the image file-ownership contract, and the image runs non-root with group 0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.4
          imagePullPolicy: Always
          args:
            - start
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-admin
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-staging:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-db
                  key: password
            - name: KC_FEATURES
              value: dpop,par
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_ENABLED
              value: "true"
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/certs/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/certs/tls.key
            - name: KC_HTTPS_PROTOCOLS
              value: TLSv1.3
            - name: KC_HOSTNAME
              value: keycloak.staging.sentinel.io
            - name: KC_PROXY_HEADERS
              value: xforwarded
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /opt/keycloak/certs
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpsGet:
              path: /health/ready
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpsGet:
              path: /health/live
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: certs
          secret:
            secretName: keycloak-staging-tls
            defaultMode: 0440
        - name: realm
          configMap:
            name: sentinel-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: staging
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
# PostgreSQL for the staging Keycloak (production mode requires an external
# database). Mirrors the hardening of infra/k8s/postgres-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-staging
  namespace: staging
  labels:
    app.kubernetes.io/name: postgres-staging
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: staging
  annotations:
    checkov.io/skip1: CKV_K8S_35=db credentials are injected from the keycloak-staging-db Secret via secretKeyRef (never plaintext); postgres' configuration contract is environment-variable based
    checkov.io/skip2: CKV_K8S_40=UID 70 is the image's dedicated postgres user (official postgres:alpine); raising it breaks the entrypoint's data-directory ownership contract and crashes initdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-staging
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: Always
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-staging-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-staging-data
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-staging
  namespace: staging
  labels:
    app.kubernetes.io/name: postgres-staging
spec:
  selector:
    app.kubernetes.io/name: postgres-staging
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Persistent database data: a pod eviction/restart during the 90-minute
# conformance window must not wipe the realm state. Requires a default
# storage class on the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-staging-data
  namespace: staging
  labels:
    app.kubernetes.io/name: postgres-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Default-deny for the staging namespace (mirrors infra/k8s/sentinel-network-policy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-default-deny-ingress
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The OIDF Conformance Suite reaches the AS through the ingress-nginx
# controller; everything else is denied by staging-default-deny-ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-keycloak-allow-ingress-nginx
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-default-deny-egress
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Required egress for the staging Keycloak: cluster DNS + the bundled
# postgres-staging database. Everything else is denied by
# staging-default-deny-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-keycloak-allow-required-egress
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-staging
      ports:
        - protocol: TCP
          port: 5432
---
# Database ingress: staging-default-deny-ingress otherwise blocks the
# Keycloak -> postgres connection above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-postgres-allow-keycloak
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-staging
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 5432

