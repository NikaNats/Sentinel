# image sentinel-k6-dpop:local is the KinD default; for EKS/AKS/GKE apply via
# tests/scripts/apply-sre-crd.sh with SRE_RUNNER_IMAGE=<registry>/k6-dpop:<tag>.
apiVersion: k6.io/v1alpha1
kind: K6
metadata:
  name: sentinel-soak-48h
  namespace: sentinel-prod
spec:
  parallelism: 4
  script:
    configMap:
      name: sentinel-sre-script
      file: sentinel-sre-suite-xk6.js
  arguments: "-e TEST_MODE=soak -e SOAK_RPS=3500 -e SOAK_DURATION=48h -e K6_PARALLELISM=4 -e K6_POOL_FILE=/pool/dpop-pool.json --summary-export=/test/summary.json"
  runner:
    image: sentinel-k6-dpop:local
    imagePullPolicy: IfNotPresent
    env:
      - name: K6_POOL_FILE
        value: /pool/dpop-pool.json
    volumeMounts:
      - name: dpop-pool
        mountPath: /pool
        readOnly: true
    volumes:
      - name: dpop-pool
        secret:
          secretName: sentinel-dpop-pool
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 1Gi