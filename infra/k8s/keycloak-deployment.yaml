#
# Keycloak deployment for the chaos gate. Deployed in the "keycloak" namespace
# so the DNS pattern keycloak.keycloak.svc.cluster.local (used by
# Keycloak__Authority and the dns-latency chaos manifest) resolves natively.
#
# Baseline alignment with docker-compose.yml: image 26.6.4, TLS-only on 8443,
# realm import from infra/keycloak/realms/sentinel.json (ConfigMap
# sentinel-realm-config, created by tests/scripts/chaos-provision.sh before
# this manifest is applied). Certificates come from the sentinel-keycloak-tls
# secret (infra/certs/keycloak.crt|key, signed by infra/certs/ca.crt - the CA
# that sentinel-api trusts via sentinel-ca-bundle).
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: sentinel
  annotations:
    checkov.io/skip1: CKV_K8S_35=Keycloak requires credentials via environment variables; secrets injected via secretKeyRef
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.4
          imagePullPolicy: Always
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap
                  key: admin-password
            - name: KC_GATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-gate
                  key: gate-password
            - name: KC_FEATURES
              value: dpop,par
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_PROTOCOLS
              value: TLSv1.3
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/x509/https/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/x509/https/tls.key
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            - name: https-certs
              mountPath: /etc/x509/https
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/ready
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: https-certs
          secret:
            secretName: sentinel-keycloak-tls
            defaultMode: 0440
        - name: realm-import
          configMap:
            name: sentinel-realm-config
            items:
              - key: sentinel.json
                path: sentinel.json
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: 8443