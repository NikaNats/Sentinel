#
# Local OIDF FAPI 2.0 Conformance Suite stack.
#
# Usage (from the repository root, AFTER the root stack is up):
#   docker compose up -d keycloak redis
#   docker compose -f infra/fapi-conformance/docker-compose.yml \
#     --env-file infra/fapi-conformance/.env up -d --build
#   make fapi-conformance-local
#
# Topology:
#   mongodb (data) <- conformance-server (Java/Spring, :9443 HTTPS)
#                  <- fapi-proxy (nginx, :8443 HTTPS -> :9443)
#   Keycloak + Sentinel API run from the ROOT docker-compose.yml
#   (project sentinel-fapi2-stack). The suite joins that stack's default
#   network so it can reach the AS as https://keycloak:8443 - the Keycloak
#   dev cert (infra/certs/keycloak.crt) already carries the `keycloak` SAN.
#   Outbound TLS trust for the local CA is injected via JAVA_TOOL_OPTIONS
#   (truststore.p12 generated by certs/generate-fapi-certs.sh).
#
# Docs: docs/OIDF_FAPI_CONFORMANCE_RUNBOOK.md

name: sentinel-fapi-suite

services:
  # ── Data store ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: fapi-mongodb
    volumes:
      - fapi-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fapi-net

  # ── OIDF Conformance Suite (official image) ────────────────────
  conformance-server:
    image: registry.gitlab.com/openid/conformance-suite:latest
    container_name: fapi-suite-server
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # --- Core ---
      MONGO_URI: "mongodb://mongodb:27017"
      SERVER_PORT: "9443"
      # API bearer token; matches FAPI_SUITE_TOKEN in infra/fapi-conformance/.env
      TOKEN: "${FAPI_SUITE_TOKEN:?Set FAPI_SUITE_TOKEN in infra/fapi-conformance/.env}"
      # --- Local dev profile: suite runs without its own OIDC login ---
      SPRING_PROFILES_ACTIVE: "dev"
      # --- TLS inside the container ---
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: "file:/app/certs/keystore.p12"
      SERVER_SSL_KEY_STORE_PASSWORD: "${FAPI_KEYSTORE_PASSWORD:-sentinel-fapi}"
      SERVER_SSL_KEY_STORE_TYPE: "PKCS12"
      # --- Outbound TLS trust: the local CA signs Keycloak's dev cert;
      #     the JVM must trust it or discovery/TLS tests fail with
      #     SSLHandshakeException (PKCS12 generated by the cert script). ---
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/app/certs/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=${FAPI_KEYSTORE_PASSWORD:-sentinel-fapi}"
      # --- Logging ---
      LOGGING_LEVEL_ROOT: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "${FAPI_LOG_LEVEL:-WARN}"
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "9443:9443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-sf", "https://localhost:9443/api/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - fapi-net
      # Joins the root stack network so the suite can reach
      # https://keycloak:8443 and http://sentinel-api:8080 by name.
      - sentinel-stack

  # ── TLS reverse proxy (nginx) ──────────────────────────────────
  # Exposes the suite at https://localhost:8443 (browser + runner default).
  fapi-proxy:
    image: nginx:1.27-alpine
    container_name: fapi-proxy
    depends_on:
      conformance-server:
        condition: service_healthy
    ports:
      - "${FAPI_PROXY_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - fapi-net

volumes:
  fapi-mongo-data:

networks:
  fapi-net:
    driver: bridge
  # External: the root docker-compose.yml declares `name: sentinel-fapi2-stack`,
  # so its default network is sentinel-fapi2-stack_default.
  sentinel-stack:
    name: sentinel-fapi2-stack_default
    external: true