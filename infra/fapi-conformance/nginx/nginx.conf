#
# nginx reverse proxy for the local OIDF FAPI 2.0 Conformance Suite.
# Terminates TLS (self-signed cert from certs/generate-fapi-certs.sh) on
# :8443 and proxies to the Spring Boot suite on conformance-server:9443.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream conformance {
        server conformance-server:9443;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         https://conformance;
            proxy_ssl_verify   off;          # upstream uses the same self-signed cert
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 300s;         # long-running test plans
            proxy_send_timeout 300s;
        }
    }
}