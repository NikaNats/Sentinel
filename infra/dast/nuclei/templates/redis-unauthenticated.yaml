#
# Sentinel - Redis reachability WITHOUT authentication must fail.
# The DAST stack runs Redis internally WITHOUT password (in-cluster network
# only). A positive here means the Redis port is reachable from an attacker
# vantage point (i.e. the containers are over-exposed). Run against
# redis:6379 inside the DAST network only.
id: redis-unauthenticated
info:
  name: Redis - unauthenticated exposure
  author: sentinel-sec
  severity: high
  description: Redis answers INFO without any AUTH handshake - if reachable, the cache (incl. replay-protection state) is exposed.
  tags: redis,exposure,unauth

network:
  - inputs:
      - data: "*1\r\n$4\r\nINFO\r\n"
        read: 1024
    host:
      - "{{Host}}:6379"
    matchers-condition: and
    matchers:
      - type: word
        part: data
        words:
          - "$redis_version"
      - type: word
        part: data
        words:
          - "NOAUTH"
        negative: true