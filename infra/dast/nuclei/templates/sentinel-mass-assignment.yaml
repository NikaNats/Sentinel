#
# Sentinel - mass assignment on entity creation MUST be rejected.
#
# The document entity's owner is derived from the authenticated principal
# (sub claim), NEVER from the request body. A vulnerable API would bind an
# injected "owner" field, assigning the document to the attacker-controlled
# subject and hiding it from the caller's own listing.
#
# Detection: create a document with an injected owner field, then retrieve the
# document by id. A hardened API ignores the extra field: the document stays
# owned by the caller and GET /v1/documents/{id} returns 200. A vulnerable API
# reassigns ownership away from the caller and the same GET returns 404.
# Fire only on 404 (fire-on-vulnerability). Runs authenticated through the DPoP
# proxy (both requests share the proxy's client identity); unauthenticated runs
# get 401 on request 1 and cannot match.
id: sentinel-mass-assignment
info:
  name: Sentinel - mass assignment on entity creation must be rejected
  author: sentinel-sec
  severity: high
  description: Ownership-controlling fields (owner, roles, permissions) must be derived from the authenticated principal; a request body field that reassigns ownership indicates a mass-assignment vulnerability (CWE-915).
  reference:
    - https://owasp.org/www-project-api-security/
    - https://cwe.mitre.org/data/definitions/915.html
  tags: sentinel,mass-assignment,cwe-915,api

http:
  # Request 1: create a document carrying an injected owner field.
  # SETUP-ONLY: no matchers here (any matcher would fire the finding on every
  # working API - the create always succeeds). The id is extracted as an
  # internal variable; if the create fails the variable stays empty and
  # request 2 falls back to the listing (200), which cannot match. Request 2
  # carries the actual fire-on-vulnerability logic.
  - method: POST
    path:
      - "{{BaseURL}}/v1/documents"
    headers:
      Content-Type: application/json
    body: "{\"title\":\"mass-assignment-probe-{{randstr}}\",\"content\":\"probe\",\"owner\":\"attacker-controlled-sub\"}"
    extractors:
      - type: regex
        part: body
        regex:
          - '"id":\s*"([0-9a-fA-F-]{36})"'
        group: 1
        internal: true
        name: doc_id

  # Request 2: the caller MUST still be able to read the document it just
  # created. A 404 means the injected owner field was honored (the document
  # was reassigned away from the caller) - mass assignment. Any other status
  # (200 on the doc, 200 on the fallback listing) is a non-result.
  - method: GET
    path:
      - "{{BaseURL}}/v1/documents/{{doc_id}}"
    matchers:
      - type: status
        status:
          - 404