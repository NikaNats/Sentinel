#
# Sentinel - TLS 1.2 (or older) MUST fail.
# Sentinel's Keycloak is pinned KC_HTTPS_PROTOCOLS=TLSv1.3 (TLS 1.3 only).
# This template performs a RAW TLS 1.2 ClientHello (byte 0x03 0x03) and flags
# the endpoint if the server completes a ServerHello with protocol version
# 0x0303 (TLS 1.2). When TLS 1.3 is enforced the server replies with a
# protocol_version alert and the matcher does not fire.
id: sentinel-tls12-rejected
info:
  name: Sentinel - TLS 1.2 handshake must be rejected
  author: sentinel-sec
  severity: high
  description: SSL-enabled services are pinned to TLS 1.3-only (KC_HTTPS_PROTOCOLS=TLSv1.3). A TLS 1.2 ServerHello indicates a downgrade regression.
  reference:
    - https://www.rfc-editor.org/rfc/rfc8446.html
  tags: sentinel,tls,downgrade

network:
  - inputs:
      - data: "\x16\x03\x01\x00\xcb\x01\x00\x00\xc7\x03\x03\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x2f\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
        read: 2048
    host:
      - "{{Host}}:8443"
    matchers-condition: and
    matchers:
      - type: binary
        part: data
        words:
          - "\x16\x03\x03"
    extractors:
      - type: regex
        part: data
        regex:
          - "\x16\x03\x03\x00"