#
# Sentinel - DPoP-bound request WITHOUT a DPoP proof must be rejected.
# RFC 9449 section 4.2: a bound-access-token request cannot omit the proof.
# Sentinel must answer 401/400 with a ProblemDetails body carrying
# "/errors/missing-dpop-proof" or "/errors/invalid-dpop-proof"
# (src/Sentinel.AspNetCore/Errors/ErrorCodes.cs).
#
# Detection semantics: this template FIRES ONLY ON VULNERABILITY, i.e. when
# the request is ACCEPTED (2xx) despite the missing proof. Correct rejections
# (401/400) do NOT match, so the release gate stays green on a hardened
# pipeline. A 2xx acceptance on ANY protected endpoint is the finding itself
# (the proof was waived) - no body inspection is needed.
#
# RUN PLACEMENT: must run against the API DIRECTLY (unauth run in
# dast-release-gate.yml). Through the DPoP auth proxy the Authorization header
# is stripped and a valid proof is injected, so a proxy-run 200 is EXPECTED
# behaviour and would be a false positive - the workflow excludes it there.
id: sentinel-dpop-missing-proof
info:
  name: Sentinel - DPoP proof missing must be rejected
  author: sentinel-sec
  severity: high
  description: A DPoP-bound access token presented without the DPoP proof header must be rejected (RFC 9449 section 5); acceptance indicates a DPoP binding failure.
  reference:
    - https://datatracker.ietf.org/doc/html/rfc9449#section-5
  tags: sentinel,dpop,missing-proof

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/documents"
      - "{{BaseURL}}/v1/profile"
      - "{{BaseURL}}/v1/security-context"
      - "{{BaseURL}}/v1/test/protected"
    headers:
      Authorization: "Bearer attacker-controlled-but-unbound-jwt"
    matchers-condition: or
    matchers:
      - type: status
        status:
          - 200
          - 201
          - 202
          - 203
          - 204
