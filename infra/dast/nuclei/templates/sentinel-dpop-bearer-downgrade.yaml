#
# Sentinel - Bearer downgrade on a DPoP-bound API MUST be rejected.
# RFC 9449 section 5.1: a DPoP-bound access token must be presented with the
# DPoP scheme; a plain Bearer presentation must be rejected. Sentinel's DPoP
# middleware answers 401 (WWW-Authenticate: DPoP error="invalid_dpop_proof").
#
# Fire-on-vulnerability semantics: any response that is NOT a rejection
# (401/400/403) means the raw Bearer header was accepted - a DPoP binding
# failure - and the finding fires. Correct rejections never match, so the
# release gate stays green on a hardened pipeline.
#
# RUN PLACEMENT: this template must run against the API DIRECTLY (unauth run
# in dast-release-gate.yml). Through the DPoP auth proxy the raw Authorization
# header is stripped and re-signed, so a proxy-run 200 is EXPECTED behaviour
# and would be a false positive - the workflow excludes it there.
id: sentinel-dpop-bearer-downgrade
info:
  name: Sentinel - Bearer downgrade on DPoP-bound API must be rejected
  author: sentinel-sec
  severity: critical
  description: A plain Bearer token presented against a DPoP-bound endpoint must be rejected with 401/403 (RFC 9449); any non-rejection response indicates DPoP binding failure and possible data exposure.
  reference:
    - https://datatracker.ietf.org/doc/html/rfc9449
    - https://datatracker.ietf.org/doc/html/rfc8705
  tags: sentinel,dpop,bearer-downgrade

http:
  - raw:
      - |
        GET {{path}} HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer forged-token-value
    path:
      - /v1/documents
      - /v1/profile
      - /v1/security-context
      - /v1/test/protected
    matchers-condition: or
    matchers:
      - type: status
        status:
          - 401
          - 400
          - 403
        negative: true