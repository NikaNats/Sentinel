{{- if .Values.bundledServices.redisHA.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-redis-ha-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  init.sh: |
    #!/bin/sh
    set -e
    INDEX="${HOSTNAME##*-}"
    if [ "$INDEX" = "0" ]; then
      echo "Configuring as Initial Primary..."
      echo "bind 0.0.0.0" > /data/redis.conf
      echo "port 6379" >> /data/redis.conf
      echo "protected-mode no" >> /data/redis.conf
      echo "dir /data" >> /data/redis.conf
    else
      echo "Configuring as Replica of redis-ha-0..."
      echo "bind 0.0.0.0" > /data/redis.conf
      echo "port 6379" >> /data/redis.conf
      echo "protected-mode no" >> /data/redis.conf
      echo "dir /data" >> /data/redis.conf
      echo "replicaof {{ include "sentinel.fullname" . }}-redis-ha-0.{{ include "sentinel.fullname" . }}-redis-ha.{{ .Values.global.namespace }}.svc.cluster.local 6379" >> /data/redis.conf
    fi

    # Sentinel Configuration
    echo "port 26379" > /data/sentinel.conf
    echo "bind 0.0.0.0" >> /data/sentinel.conf
    echo "dir /data" >> /data/sentinel.conf
    echo "sentinel resolve-hostnames yes" >> /data/sentinel.conf
    echo "sentinel announce-hostnames yes" >> /data/sentinel.conf
    echo "sentinel monitor mymaster {{ include "sentinel.fullname" . }}-redis-ha-0.{{ include "sentinel.fullname" . }}-redis-ha.{{ .Values.global.namespace }}.svc.cluster.local 6379 2" >> /data/sentinel.conf
    echo "sentinel down-after-milliseconds mymaster 2000" >> /data/sentinel.conf
    echo "sentinel failover-timeout mymaster 5000" >> /data/sentinel.conf
    echo "sentinel parallel-syncs mymaster 1" >> /data/sentinel.conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-redis-ha
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Sentinel resolves peer hostnames at startup; without this, pod DNS
  # records are only published after readiness, causing a startup deadlock.
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
  selector:
    app.kubernetes.io/name: {{ include "sentinel.name" . }}-redis-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sentinel.fullname" . }}-redis-ha
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "sentinel.fullname" . }}-redis-ha
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sentinel.name" . }}-redis-ha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sentinel.name" . }}-redis-ha
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: busybox:1.36
          command: ["/bin/sh", "/config/init.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        # Container 1: Redis Server (Primary / Replica)
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "/data/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

        # Container 2: Sentinel Monitor (Sidecar)
        - name: sentinel
          image: redis:7.4-alpine
          command: ["redis-sentinel", "/data/sentinel.conf"]
          ports:
            - name: sentinel
              containerPort: 26379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "sentinel.fullname" . }}-redis-ha-config
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}
