{{- if .Values.bundledServices.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-realm-import
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: infrastructure
data:
  sentinel-realm.json: |
    {{- .Files.Get "files/sentinel-realm.json" | nindent 4 }}
  sentinel-dast-realm.json: |
    {{- .Files.Get "files/sentinel-dast-realm.json" | nindent 4 }}
---
# Test-runner allowance: permits in-cluster E2E verification pods (e.g.
# dpop-e2e-runner) to reach Keycloak's TLS endpoint. Least-privilege: scoped
# to port 8443 only, same namespace, label-selected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-keycloak-allow-test-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dpop-e2e-runner
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: infrastructure
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ .Values.bundledServices.keycloak.image | default "quay.io/keycloak/keycloak:26.6.4" | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
            - --health-enabled=true
            - --metrics-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            - name: KC_FEATURES
              value: "dpop,par"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTP_MANAGEMENT_HEALTH_ENABLED
              value: "false"
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_PROTOCOLS
              value: "TLSv1.3"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: "/etc/x509/https/tls.crt"
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: "/etc/x509/https/tls.key"
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            # DEV-BUNDLE DEVIATION: Keycloak upstream does not fully support
            # read-only root filesystem (Quarkus rewrites /opt/keycloak/lib during
            # start-dev). Non-root, no-privilege, dropped-caps are preserved.
            # Production uses a managed external IdP where this container is not
            # rendered.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            - name: https-certs
              mountPath: /etc/x509/https
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # Keycloak 26 serves /health/* on the main TLS listener (8443) when
          # KC_HTTP_ENABLED=false - the management :9000 only carries /metrics.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: https
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: https
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/ready
              port: https
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: https-certs
          secret:
            secretName: sentinel-keycloak-tls
            defaultMode: 0440
        - name: realm-import
          configMap:
            name: sentinel-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: infrastructure
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: 8443
{{- end }}
