{{- if or .Values.bundledServices.redis.enabled .Values.bundledServices.postgres.enabled .Values.bundledServices.keycloak.enabled }}
# Bundled-mode runtime credentials consumed by the Sentinel API deployment
# (ConnectionStrings__* and Keycloak client secret). DEV/STAGING GRADE ONLY.
#
# Production must NOT render this template: pre-provision
# `sentinel-runtime-secrets` externally via External Secrets Operator / Vault
# (see docs/KUBERNETES_SECRET_MANAGEMENT_STRATEGY.md).
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-runtime-secrets
  labels:
    app.kubernetes.io/part-of: sentinel
type: Opaque
stringData:
  postgres-connection-string: "Host=postgres;Port=5432;Database={{ .Values.bundledServices.postgres.dbName | default "sentinel_dev" }};Username=postgres;Password=postgres"
  redis-connection-string: {{ .Values.api.config.redis.endpoint | quote }}
  keycloak-client-secret: "bundled-dev-secret"
{{- end }}
