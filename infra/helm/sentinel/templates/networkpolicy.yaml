{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel.fullname" . }}-api-allow
spec:
  podSelector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress Controller Ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNginxNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    # Observability Scraper Ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # CoreDNS Resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allowed Backend Protocols, External HTTPS & Redis Sentinel HA
    - ports:
        - protocol: TCP
          port: 443     # External HTTPS (Turnstile CAPTCHA, Vault, Cloud APIs)
        - protocol: TCP
          port: 8443    # Internal Keycloak HTTPS
        - protocol: TCP
          port: 6379    # Redis Server (Data Port)
        - protocol: TCP
          port: 26379   # Redis Sentinel (HA Quorum & Failover Port)
        - protocol: TCP
          port: 5432    # PostgreSQL Database
        - protocol: TCP
          port: 4317    # OpenTelemetry Collector (gRPC)
{{- end }}