global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Collector-fanned metrics (service.name label attached via
  # resource_to_telemetry_conversion) - the authoritative view for the gate.
  - job_name: sentinel-collector
    static_configs:
      - targets:
          - collector:8889

  # Direct Prometheus endpoint of the API (ASP.NET Core Prometheus exporter) -
  # proves the native scrape path also works.
  - job_name: sentinel-api-direct
    static_configs:
      - targets:
          - sentinel-api:8080