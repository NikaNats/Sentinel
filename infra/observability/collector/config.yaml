# Sentinel observability collector (docker compose overlay).
# Mirrors the production collector conventions from infra/k8s/otel-config.yaml
# (memory_limiter/batch processors, health_check extension, otel-collector-contrib 0.127.0)
# and fans out to the local Prometheus / Loki / Tempo trio for the Layer-2 gate.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 410
    spike_limit_mib: 102

  batch:
    timeout: 2s
    send_batch_size: 8192
    send_batch_max_size: 16384

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check

  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus

    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/loki